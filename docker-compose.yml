services:

  # MySQL 데이터베이스
  db:
    image: mysql:5.7
    container_name: xe_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: xe_root_secret
      MYSQL_DATABASE: xpressengine
      MYSQL_USER: xe
      MYSQL_PASSWORD: xe_password
    volumes:
      - xe_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pxe_root_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PHP-FPM 애플리케이션 (PHP 7.4)
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: xe_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Nginx 웹서버
  nginx:
    image: nginx:alpine
    container_name: xe_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  xe_db_data:
    driver: local
